name: Validate check-suite pagination (fork)
on:
  push:
    branches:
      - fix/check-suites-pagination-ci
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: go version
      - name: gofmt
        run: |
          gofmt -l clients/githubrepo/checkruns.go clients/githubrepo/checkruns_pagination_test.go
          gofmt -d clients/githubrepo/checkruns.go clients/githubrepo/checkruns_pagination_test.go
          test -z "$(gofmt -l clients/githubrepo/checkruns.go clients/githubrepo/checkruns_pagination_test.go)"
      - name: Targeted regression tests
        run: SKIP_GINKGO=1 go test ./clients/githubrepo -run 'Test(ParseCheckRunsSkipsIncompleteSuites|ListCheckRunsForRefPaginatesAndCaches)$' -count=1 -v
      - name: GitHub client unit suite
        run: SKIP_GINKGO=1 go test ./clients/githubrepo -count=1
      - name: go vet
        run: go vet ./clients/githubrepo
